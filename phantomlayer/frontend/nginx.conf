server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # Re-resolve Compose service names after API container recreation.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api_upstream backend:8000;
  location / { try_files $uri $uri/ /index.html; }
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  location ~ ^/(auth|organizations|domains|agents|protections|security|incidents|honeypot|logging|gateway|routing|detection|risk|api/v1/incidents)(/|$) {
    proxy_pass http://$api_upstream$request_uri;
    proxy_set_header Host $host;
    # This API uses bearer auth, not browser cookies. In a localhost demo,
    # cookies are shared across ports; do not forward the bank's session cookie.
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
